<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'sha256-f+yLGaP9q+VnPW4HQWujcGcEOQzTZ0GJCZmfqitaFUA='; script-src 'sha256-wSGuyAy4MdkEjxxeUhCwniqy08tiGYll39ae1Rn7Sps='; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>Render Links</title>
<meta name="description" content="The fastest path to production for full-stack applications and agents">
<meta property="og:title" content="Shifra — links">
<meta property="og:description" content="The fastest path to production for full-stack applications and agents">
<meta property="og:type" content="website">
<meta property="og:image" content="https://render.com/links/assets/preview.png">
<meta property="og:image:width" content="1600">
<meta property="og:image:height" content="900">
<meta property="og:image:alt" content="Render: Your fastest path to production">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/links/assets/render-logomark-black.svg" media="(prefers-color-scheme: light)">
<link rel="icon" href="/links/assets/render-logomark-white.svg" media="(prefers-color-scheme: dark)">
<style>
@font-face {
  font-family: 'PP Neue Montreal';
  src: url('/links/assets/fonts/PPNeueMontreal-Variable.woff2') format('woff2-variations');
  font-weight: 300 500;
  font-display: swap;
}

:root {
  --bg: #FFFFFF;
  --text: #0D0D0D;
  --text-secondary: #4D4D4D;
  --text-faint: #6B6B6B;
  --hairline: #E3E3E3;
  --focus: #6C35F5;
  --tabs-bg: color-mix(in srgb, var(--text) 5%, transparent);
  --tab-selected-bg: var(--bg);
  --tab-selected-ring: #00000012;

  --radius-control: 4px;
  --radius-card: 8px;
  --radius-button: 2px;
  --grid-margin: 24px;
  --ease: cubic-bezier(0.9, 0.1, 0.1, 0.9);

  --font-default: 'PP Neue Montreal', 'Manrope', ui-sans-serif, system-ui, sans-serif;

  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D0D0D;
    --text: #FFFFFF;
    --text-secondary: #C7C7C7;
    --text-faint: #B3B3B3;
    --hairline: #272727;
    --focus: #B3B1FA;
    --tabs-bg: color-mix(in srgb, var(--text) 8%, transparent);
    --tab-selected-bg: color-mix(in srgb, var(--text) 12%, var(--bg));
    --tab-selected-ring: #ffffff0d;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100svh;
  display: flex;
  justify-content: center;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-default);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.5;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.page {
  width: 100%;
  max-width: calc(480px + 2 * var(--grid-margin));
  padding: 80px var(--grid-margin) 24px;
  display: flex;
  flex-direction: column;
}

.header { display: flex; justify-content: center; }

.logo { display: block; }
.logo:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }

/*
 * A mask painted with the text color, so the logo follows the color scheme.
 * The mask is on a child, because a mask on the link would also clip its focus ring.
 */
.logo__mark {
  display: block;
  width: 112px;
  height: 24px;
  background-color: var(--text);
  -webkit-mask: url('/links/assets/render-logo.svg') center / contain no-repeat;
  mask: url('/links/assets/render-logo.svg') center / contain no-repeat;
}

.main {
  display: flex;
  flex-direction: column;
  gap: 32px;
  padding-top: 56px;
}

.intro {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
}

.intro__title {
  margin: 0;
  font-size: 32px;
  font-weight: 500;
  line-height: 1.125;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

/* The tagline. */
.intro__text {
  margin: 0;
  max-width: 36ch;
  color: var(--text-secondary);
  text-wrap: pretty;
}

.sections {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.tabs {
  display: flex;
  gap: 2px;
  padding: 2px;
  border-radius: calc(var(--radius-control) + 2px);
  background: var(--tabs-bg);
}

.tab {
  flex: 1 1 0%;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  padding: 0 12px;
  border-radius: var(--radius-control);
  font-size: 14px;
  line-height: 20px;
  font-weight: 500;
  letter-spacing: 0;
  text-align: center;
  color: var(--text-faint);
  text-decoration: none;
}
.tab:hover { color: var(--text); }
.tab[aria-current="page"] {
  background: var(--tab-selected-bg);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--tab-selected-ring);
}
.tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.links {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
/* The display rule above would show the lists of the other tabs. */
.links[hidden] { display: none; }

.card {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 56px;
  padding: 7px 16px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-card);
  background: var(--bg);
  color: var(--text);
  text-decoration: none;
}
.card:hover { border-color: var(--text-faint); }
.card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/*
 * The icon files are dark artwork on transparency, so an <img> would disappear
 * against the dark background. Each one is a mask instead, painted with the
 * faint text color.
 */
.card__mark {
  flex: none;
  width: 20px;
  height: 20px;
  background-color: var(--text-faint);
  -webkit-mask: var(--mark) center / contain no-repeat;
  mask: var(--mark) center / contain no-repeat;
}
.card__mark--arrow { --mark: url('/links/assets/link-icons/arrow.png'); }
.card__mark--credits { --mark: url('/links/assets/link-icons/credits.png'); }
.card__mark--download { --mark: url('/links/assets/link-icons/download.png'); }
.card__mark--email { --mark: url('/links/assets/link-icons/email.svg'); }
.card__mark--form { --mark: url('/links/assets/link-icons/form.svg'); }
.card__mark--info { --mark: url('/links/assets/link-icons/info.png'); }
.card__mark--render { --mark: url('/links/assets/link-icons/render.svg'); }
.card__mark--sandbox { --mark: url('/links/assets/link-icons/sandbox.svg'); }
.card__mark--upload { --mark: url('/links/assets/link-icons/upload.png'); }
.card__mark--workflows { --mark: url('/links/assets/link-icons/workflows.svg'); }
.card__mark--play { --mark: url('/links/assets/link-icons/play.svg'); }

/* The 2px side margins make the box as wide as the 20px icon column. */
.card__step {
  flex: none;
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  margin: 0 2px;
  border: 1.25px solid;
  border-radius: var(--radius-button);
  color: var(--text-faint);
  font-size: 11px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
}

.card__body {
  flex: 1 1 0%;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.card__title {
  font-size: 16px;
  line-height: 24px;
  font-weight: 500;
  letter-spacing: 0;
  overflow-wrap: anywhere;
}

.card__hint {
  font-size: 14px;
  line-height: 16px;
  letter-spacing: 0.01em;
  color: var(--text-faint);
}

.card__go {
  flex: none;
  width: 16px;
  height: 16px;
  background-color: var(--text-faint);
  -webkit-mask: url('/links/assets/go.svg') center / contain no-repeat;
  mask: url('/links/assets/go.svg') center / contain no-repeat;
  transition: translate 200ms var(--ease);
}
.card:hover .card__go {
  background-color: var(--text);
  translate: 2px;
}

.socials {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.social {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-control);
  color: var(--text-faint);
}
.social:hover { color: var(--text); }
.social:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

/*
 * The icon files are black glyphs used as CSS masks. They take the text
 * color (currentColor), so they follow both color schemes.
 */
.social__icon {
  display: block;
  width: 18px;
  height: 18px;
  background-color: currentColor;
  -webkit-mask: var(--icon) center / contain no-repeat;
  mask: var(--icon) center / contain no-repeat;
}

.social__icon--youtube { --icon: url('/links/assets/icons/youtube.svg'); }
.social__icon--linkedin { --icon: url('/links/assets/icons/linkedin.svg'); }
.social__icon--x { --icon: url('/links/assets/icons/x.svg'); }
.social__icon--github { --icon: url('/links/assets/icons/github.svg'); }
.social__icon--discord { --icon: url('/links/assets/icons/discord.svg'); }

.footer {
  margin-top: auto;
  padding-top: 48px;
  font-size: 14px;
  line-height: 1.429;
  letter-spacing: 0.01em;
  color: var(--text-faint);
  text-align: center;
}

@media (max-width: 1023.98px) {
  .intro__title { font-size: 28px; }
}

@media (max-width: 767.98px) {
  :root { --grid-margin: 16px; }
  .intro__title { font-size: 24px; }
  .page { padding-top: 32px; }
  .main { gap: 24px; padding-top: 40px; }
  .tab { min-height: 40px; }
  .social { width: 44px; height: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  .card__go { transition: none; }
}
</style>
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="logo" href="https://render.com/" aria-label="Render home"><span class="logo__mark"></span></a>
    </header>
    <main class="main">
      <div class="intro">
        <h1 class="intro__title">Shifra</h1>
      </div>
      <div class="sections">
        <div class="links">
          <a class="card" href="https://render.com/startups" target="_blank" rel="noreferrer">
            <span class="card__mark card__mark--form" aria-hidden="true"></span>
            <span class="card__body"><span class="card__title">Funded founder? Apply to the Render startup program</span></span>
            <span class="card__go" aria-hidden="true"></span>
            <span class="visually-hidden">(opens in a new tab)</span>
          </a>
          <a class="card" href="https://render.com/" target="_blank" rel="noreferrer">
            <span class="card__mark card__mark--render" aria-hidden="true"></span>
            <span class="card__body"><span class="card__title">Render website</span></span>
            <span class="card__go" aria-hidden="true"></span>
            <span class="visually-hidden">(opens in a new tab)</span>
          </a>
          <a class="card" href="https://render.com/tutorials/render-workflows" target="_blank" rel="noreferrer">
            <span class="card__mark card__mark--workflows" aria-hidden="true"></span>
            <span class="card__body"><span class="card__title">Get started with Render Workflows</span></span>
            <span class="card__go" aria-hidden="true"></span>
            <span class="visually-hidden">(opens in a new tab)</span>
          </a>
        </div>
      </div>
      <nav class="socials" aria-label="Render on social media">
        <a class="social" href="https://www.youtube.com/@render-inc" target="_blank" rel="noreferrer" aria-label="YouTube"><span class="social__icon social__icon--youtube"></span></a>
        <a class="social" href="https://www.linkedin.com/company/renderco" target="_blank" rel="noreferrer" aria-label="LinkedIn"><span class="social__icon social__icon--linkedin"></span></a>
        <a class="social" href="https://x.com/render" target="_blank" rel="noreferrer" aria-label="X"><span class="social__icon social__icon--x"></span></a>
        <a class="social" href="https://github.com/render-oss" target="_blank" rel="noreferrer" aria-label="GitHub"><span class="social__icon social__icon--github"></span></a>
        <a class="social" href="https://render.com/discord" target="_blank" rel="noreferrer" aria-label="Discord"><span class="social__icon social__icon--discord"></span></a>
      </nav>
    </main>
    <footer class="footer">&copy; 2026 Render Inc.</footer>
  </div>
<script>
if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
  document.querySelectorAll('a[data-gmail]').forEach(function (a) {
    a.href = a.dataset.gmail;
    a.target = '_blank';
    a.rel = 'noopener';
  });
}

// A tab click shows its links in place, so the header does not load again.
// Each tab is also a full link, for a new tab, a copied URL, or no script.
var tabs = document.querySelectorAll('.tab[data-section]');

function showSection(slug) {
  tabs.forEach(function (tab) {
    if (tab.dataset.section === slug) {
      tab.setAttribute('aria-current', 'page');
    } else {
      tab.removeAttribute('aria-current');
    }
  });
  document.querySelectorAll('.links[data-section]').forEach(function (list) {
    list.hidden = list.dataset.section !== slug;
  });
}

tabs.forEach(function (tab) {
  tab.addEventListener('click', function (event) {
    if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
      return;
    }
    event.preventDefault();
    if (tab.getAttribute('aria-current') === 'page') {
      return;
    }
    showSection(tab.dataset.section);
    history.pushState({ section: tab.dataset.section }, '', tab.href);
  });
});

if (tabs.length) {
  var opened = document.querySelector('.tab[aria-current="page"]').dataset.section;
  history.replaceState({ section: opened }, '');
  addEventListener('popstate', function (event) {
    showSection(event.state && event.state.section ? event.state.section : opened);
  });
}
</script>
</body>
</html>
